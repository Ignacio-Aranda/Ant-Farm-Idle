# =====================================================================
#  CALENDARIO DE FIESTAS DEL HORMIGUERO
#  Cada [[fiesta]] decora el hormiguero entre "desde" y "hasta" (incluidos).
#  En ejemplos/ hay otro calendario más completo (fiestas de Andalucía y de España).
#
#  Fechas:  "DD-MM"            -> fecha fija, p. ej. "14-02"
#           "pascua+N" / "-N"  -> relativa al Domingo de Resurrección
#  Un rango puede cruzar el año: desde = "15-12", hasta = "06-01".
#
#  decoracion: navidad, nochevieja, reyes, halloween, difuntos, andalucia,
#              espana, semana_santa, feria, carnaval, san_juan, cruces,
#              corazones, libro, pi, banderines (genérica)
#  gorro (opcional): el sombrero que llevan las hormigas ese día:
#              fiesta, papa_noel, corona, capirote, bruja, flor, antifaz
#  mensaje: sale en el cielo mientras dura la fiesta (de día y de noche; el día de un
#           cumpleaños sale el suyo en su lugar) y en el diario el primer día.
# =====================================================================

[[fiesta]]
nombre = "Navidad"
desde = "15-12"
hasta = "06-01"
decoracion = "navidad"
mensaje = "¡Feliz Navidad desde el hormiguero!"

