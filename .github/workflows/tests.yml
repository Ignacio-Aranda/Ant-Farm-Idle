# Pasa todas las pruebas (tests/) en cada push y en cada pull request, con Python 3.11 y 3.13.
# Sin pantalla ni sonido: pygame dibuja en memoria (SDL_VIDEODRIVER=dummy).
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # la letra de los textos (como en la Pi): sin ella se usa otra con otras medidas
      - name: Fuente DejaVu
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: pygame
        run: python -m pip install pygame

      - name: Pruebas
        run: python -m unittest discover -s tests -v
