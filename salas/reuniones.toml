# =====================================================================
#  SALA DE REUNIONES
#  No tiene miembros fijos: las hormigas vienen aquí a las reuniones.
#  Mismo formato que salas/desarrollo.toml (allí está explicado).
# =====================================================================

nombre = "Reuniones"
color = "azul_brillante"
planta = 1
ancho = 30
tipo = "reuniones"

# Reuniones fijas: a esa hora las hormigas citadas vienen a la sala.
#   dia     : lunes, martes, miércoles, jueves, viernes o "todos" (de lunes a viernes)
#   hora    : "HH:MM", de "00:00" a "23:59"
#   minutos : duración
#   quien   : "todos"; una sala, por el nombre de su fichero sin .toml ("diseno") o por
#             el que sale en pantalla ("Diseño"); una persona ("Elena"), o una lista
#             de nombres, p. ej. ["Elena", "Ana"]
#   Si una reunión está mal escrita o no convoca a nadie, sale un aviso y no se hace.
[[reunion]]
nombre = "Reunión de equipo"
dia = "lunes"
hora = "10:00"
minutos = 60
quien = "todos"

[[reunion]]
nombre = "Revisión de diseño"
dia = "jueves"
hora = "12:00"
minutos = 45
quien = "diseno"
