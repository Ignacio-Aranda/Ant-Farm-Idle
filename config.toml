# Configuración de Ant Farm Idle

[general]
nombre = "la Oficina"      # sale en el diario: «Se funda el hormiguero de la Oficina: ...»
# fundacion: el día 0 del hormiguero. Si no la pones, es el día en que se arranca por
#   primera vez con la hora de verdad (se guarda en local/estado.json y ya no cambia).
# fundacion = "2026-01-01"
# semilla: el número del que sale el trazado de los túneles y la colocación de las salas.
#   Si no la pones, se elige una al azar la primera vez y se guarda.
# semilla = 2026
fps_pixel = 20             # fotogramas por segundo de la versión gráfica

[ciudad]
# Para el sol (amanecer y anochecer) y para el tiempo real. Búscalas en un mapa.
# Con la latitud negativa (hemisferio sur), las estaciones, las flores y los bichos van al revés.
nombre = "Málaga"
lat = 36.72
lon = -4.42
# zona_horaria: la de la ciudad. Si la pones, el reloj del hormiguero, los horarios y el sol
#   van en la hora de la ciudad aunque el ordenador esté en otra zona (UTC, por ejemplo).
# zona_horaria = "Europe/Madrid"

[tiempo]
# fuente = "openweather": tiempo real de https://openweathermap.org (gratis, hace falta una clave).
#   Guarda la clave en el fichero local/openweather_clave.txt (mejor que aquí: así no la
#   enseñas si compartes este fichero) o en la variable de entorno OPENWEATHER_API_KEY
#   (para el servicio de la Pi, en local/entorno: OPENWEATHER_API_KEY=tu_clave).
# fuente = "estadistico": sin internet, con un clima de ejemplo (el de Málaga).
# Si no hay clave o falla internet, se usa el estadístico.
fuente = "openweather"
cada_minutos = 10          # cada cuánto se pide el tiempo
# clave = ""

[horario]
desayuno = "10:30-11:00"   # a esta hora muchas van al comedor
comida = "13:30-15:30"     # y a esta, casi todas
jornada = "09:00-18:00"    # quien es jefe sólo llama al despacho en este horario (días laborables)

[nido]
entrada = 20               # columna preferida para la entrada (de 3 a 156)
# cavar = "encendido": las obras sólo avanzan mientras el hormiguero está en marcha (lo que
#   llevan se guarda en local/estado.json). Una semana apagado, una semana sin obras.
# cavar = "fecha": avanzan con los días desde la fundación, esté encendido o no.
cavar = "encendido"
# Salas que excavan a lo largo del año, en orden (cada una usa el tipo de su nombre):
obras = ["despensa", "museo", "hongos", "almacen", "biblioteca"]

[paisaje]
# Lo que se ve arriba. x es la posición en % del ancho (0 = izquierda, 100 = derecha).
montes = true              # montes al fondo
costa = true               # gaviotas
cementerio = 74            # dónde empieza el cementerio de los que se fueron (en %)

# En la superficie: chumbera, almendro, palmera, olivo, pino, farola, banco, casa
[[paisaje.suelo]]
pieza = "chumbera"
x = 2

[[paisaje.suelo]]
pieza = "palmera"
x = 30

[[paisaje.suelo]]
pieza = "farola"
x = 42

[[paisaje.suelo]]
pieza = "olivo"
x = 49

[[paisaje.suelo]]
pieza = "almendro"
x = 89

# Al fondo, sobre los montes: catedral, ciudad, faro, molino, torre, castillo
[[paisaje.fondo]]
pieza = "catedral"
x = 58

[halloween]
# Del 26 al 31 de octubre, los que se fueron (idos.toml) salen del cementerio y se pasean
# por el hormiguero como hormigas esqueleto.
esqueletos = true
