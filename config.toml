# Configuración de Ant Farm Idle

[general]
nombre = "la Oficina"      # sale en el diario: «Se funda el hormiguero de la Oficina: ...»
fundacion = "2026-01-01"   # día 0: el hormiguero crece a partir de esta fecha
semilla = 2026             # cambia el número para otro trazado de túneles
fps = 8                    # fotogramas por segundo de la versión de terminal
unicode = "auto"           # auto | si | no
fps_pixel = 20             # fotogramas por segundo de la versión gráfica
